[theme]
base = "dark"
primaryColor = "#2F6BFF"
backgroundColor = "#05070D"
secondaryBackgroundColor = "#0B1220"
textColor = "#E6ECF8"
linkColor = "#7FA6FF"
borderColor = "#1B2A47"
codeBackgroundColor = "#0B1220"
redColor = "#9DB8E8"
orangeColor = "#7FA6FF"
yellowColor = "#9DB8E8"
greenColor = "#5B8DEF"
blueColor = "#2F6BFF"
violetColor = "#8FA6D8"
grayColor = "#8C9AB5"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
baseFontSize = 15
headingFontSizes = ["2.2rem", "1.7rem", "1.35rem", "1.15rem", "1.0rem", "0.9rem"]
headingFontWeights = [650, 650, 600, 600, 600, 600]
metricValueFontSize = "2rem"
metricValueFontWeight = 600
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = false
linkUnderline = false
paddingTop = "2.5rem"
paddingBottom = "3rem"
dataframeBorderColor = "#1B2A47"
dataframeHeaderBackgroundColor = "#0B2A5B"
dataframeHeaderTextColor = "#FFFFFF"
chartCategoricalColors = ["#2F6BFF", "#E6ECF8", "#8FA6D8", "#0B2A5B", "#5B8DEF", "#8C9AB5", "#1E3F78"]
chartSequentialColors = ["#0B1B3A", "#0B2A5B", "#1E3F78", "#2F6BFF", "#7FA6FF", "#C7D8FF"]

[client]
toolbarMode = "minimal"
